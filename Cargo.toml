[package]
name = "kite"
version = "0.1.4"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.7.3"
anyhow = "1.0"
async-channel = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tdlib-rs = { version = "=1.4.0", features = ["download-tdlib", "static"] }
smol = "2.0"
chrono = "0.4.45"
url = "2.5"
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "UNNotificationSettings"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSBundle", "NSError", "NSURL", "NSDate", "NSGeometry", "NSObject"] }
# The Dock icon when running outside the app bundle (cargo run), and the
# menu bar item.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSEvent", "NSBezierPath", "NSColor", "NSFont", "NSGraphics", "NSStringDrawing", "NSAttributedString", "block2", "objc2-core-foundation"] }
# In-app playback of voice messages, audio files and round video messages.
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioPlayer"] }
# Animated stickers: TGS is gzipped Lottie JSON, rendered to frames.
rasterlottie = { version = "0.2.4", default-features = false }
flate2 = "1.1"
# Voice notes: Ogg Opus is rewritten as CAF, which macOS decodes natively.
ogg = "0.9"
image = { version = "0.25", default-features = false }
objc2-core-image = { version = "0.3.2", default-features = false, features = ["std", "CIFilter", "CIFilterBuiltins", "CIImage", "CIContext", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "AVTime", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMBase", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"


# GPUI, image decoders and TDLib bindings are far too slow unoptimized, and
# the app's own layout code runs every frame, so optimize both in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
