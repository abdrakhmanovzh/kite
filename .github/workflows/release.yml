# Pushing a tag like v0.2.0 builds Kite.dmg and publishes it as a GitHub
# release. Needs repository secrets KITE_API_ID and KITE_API_HASH (from
# my.telegram.org) to build the Telegram API credentials in.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Video stickers; linked statically into the app.
      - run: brew install libvpx

      - name: Build Kite.dmg
        env:
          KITE_API_ID: ${{ secrets.KITE_API_ID }}
          KITE_API_HASH: ${{ secrets.KITE_API_HASH }}
        run: sh scripts/bundle.sh --dmg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          1. Download **Kite.dmg** below and open it.
          2. Drag **Kite** into **Applications**.
          3. Open Kite. The first time, macOS blocks it because it isn't signed by a paid Apple developer account: open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. You only do this once.

          Requires a Mac with Apple Silicon (M1 or later), macOS 13 or later.
          NOTES
          gh release create "$GITHUB_REF_NAME" target/Kite.dmg --title "Kite $GITHUB_REF_NAME" --notes-file notes.md

      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Kite.dmg
          path: target/Kite.dmg
